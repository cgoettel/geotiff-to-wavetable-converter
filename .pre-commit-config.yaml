# File hygiene (trailing-whitespace, end-of-file-fixer, check-added-large-files,
# mixed-line-ending, check-merge-conflict), markdown formatting, secret scanning,
# and conventional commit-msg linting now live in the fleet-wide global pre-commit
# hygiene tier (~/.config/pre-commit/global.yaml, run via core.hooksPath). This
# config keeps only the language-specific toolchain, which the CI test job runs
# on every merge request and push to main.
repos:
    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.3.1
      hooks:
          - id: mypy
            args: [--strict, --ignore-missing-imports]
            # The hook runs in an isolated env; without pytest's stubs, strict mode
            # rejects @pytest.mark.parametrize as an untyped decorator.
            additional_dependencies: [pytest]
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.7
      hooks:
          - id: ruff
            args: [--fix]
          - id: ruff-format
