# mirror_to_github: mirror main to github.com/cgoettel/geotiff-to-wavetable-converter on every push to main.
# GITHUB_DEPLOY_KEY is a File-type CI variable holding the SSH private key
# whose public half is a write-enabled deploy key on the GitHub repo.
#
# publish_to_pypi: pushing a version tag (v0.2.0) tests, builds, and uploads that version to PyPI.
# No stored secret: PyPI trusts this project's GitLab CI via a trusted publisher
# (pypi.org → geotiff-to-wavetable → Settings → Publishing), so the job trades
# GitLab's short-lived identity token for a short-lived PyPI upload token.
#
# test: every merge request and every push to main runs the tests and the pre-commit hooks (ruff, mypy).

# Pipelines run for merge requests, main, and version tags. A branch with an open merge request
# gets only the merge request pipeline, not a second branch pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.uv_python:
  # Python 3.13, not 3.14: uv.lock pins numpy 2.2.6 (the last release supporting Python 3.10), which ships
  # no 3.14 wheels, and this slim image has no compiler to build it from source.
  image: ghcr.io/astral-sh/uv:0.12.22-python3.13-trixie-slim
  # ghcr.io rate-limits image pulls across GitLab's shared runners. Retry those infrastructure failures, never a
  # failing script: GitLab reports a failed test as script_failure, which this doesn't match.
  retry:
    max: 2
    when: [runner_system_failure]
  before_script:
    # rasterio's wheel links against the system libexpat, which the slim image lacks. (OpenCV needs nothing: the
    # headless build bundles its libraries, unlike opencv-python, which needed libgl1 and libglib2.0-0 here.)
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends libexpat1 > /dev/null

test:
  extends: .uv_python
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
  cache:
    key:
      files: [uv.lock, .pre-commit-config.yaml]
    paths: [.cache/uv, .cache/pre-commit]
  before_script:
    - !reference [.uv_python, before_script]
    # pre-commit lists files and fetches hook repositories with git, which the slim image also lacks.
    - apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - uv run --extra test pytest -q
    # The hooks themselves, not the locked ruff and mypy, so CI checks exactly what a local commit does.
    - uv run --extra test pre-commit run --all-files --show-diff-on-failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

mirror_to_github:
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # glab strips trailing newline from variable values — re-add it
    - cp "$GITHUB_DEPLOY_KEY" ~/.ssh/id_ed25519
    - printf '\n' >> ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - git remote add github git@github.com:cgoettel/geotiff-to-wavetable-converter.git
    - git push --force github HEAD:refs/heads/main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

publish_to_pypi:
  extends: .uv_python
  # The trusted publisher on PyPI is scoped to this environment name.
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    # The tag must match the version being built, or PyPI would get a mislabeled release.
    - test "v$(uv version --short)" = "$CI_COMMIT_TAG" || { echo "Tag $CI_COMMIT_TAG does not match pyproject version $(uv version --short)"; exit 1; }
    - uv run --extra test pytest -q
    - uv build
    # Exchange the GitLab identity token for a PyPI API token that expires in minutes:
    # https://docs.pypi.org/trusted-publishers/using-a-publisher/#gitlab-cicd
    - |
      PYPI_API_TOKEN=$(uv run --no-project python - <<'EOF'
      import json, os, urllib.request
      request = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      print(json.load(urllib.request.urlopen(request))["token"])
      EOF
      )
    - uv publish --token "$PYPI_API_TOKEN"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
